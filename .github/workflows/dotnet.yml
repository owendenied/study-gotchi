name: .NET Build and Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore StudyGotchi/StudyGotchi.slnx

      - name: Build app
        run: dotnet build StudyGotchi/StudyGotchi.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test StudyGotchi.Tests/StudyGotchi.Tests.csproj --configuration Release --no-restore --verbosity normal
